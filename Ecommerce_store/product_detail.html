<!DOCTYPE html>
<html>
<head>
    <title>Product Detail</title>

    <style>
        body { font-family: Arial; margin: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; width: 300px; }
        button { padding: 10px; background: green; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <h3>₹{{ product.price }}</h3>

    <a href="/add/{{ product.id }}/">
        <button onclick="added()">Add to Cart</button>
    </a>

    <br><br>

    <a href="/cart/">Go to Cart</a>
</div>

<script>
function added() {
    alert("Product added to cart!");
}
</script>

</body>
</html>
